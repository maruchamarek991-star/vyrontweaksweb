<style>
:root{--bg:#050506;--text:#f4f5f7}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(60% 50% at 50% 45%,rgba(120,140,190,.12),transparent 70%),var(--bg);color:var(--text);font-family:"Space Grotesk",Inter,system-ui,sans-serif;display:grid;place-items:center;overflow:hidden}
main{display:flex;flex-direction:column;align-items:center;gap:22px;padding:24px;text-align:center}
main img{width:clamp(96px,22vw,168px);height:auto;filter:drop-shadow(0 0 28px rgba(160,180,255,.35));animation:in .9s ease both}
h1{margin:0;font-size:clamp(34px,7vw,56px);font-weight:700;letter-spacing:.04em;background:linear-gradient(180deg,#fff 10%,#8e9099);-webkit-background-clip:text;background-clip:text;color:transparent;animation:in .9s .15s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){main img,h1{animation:none}}
</style>
