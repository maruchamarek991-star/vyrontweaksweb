<style>
:root{--bg:#000;--text:#fff;--mute:#a4a8b3;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:300 20px/1.65 Outfit,system-ui,sans-serif;overflow-x:hidden;animation:page .5s ease both}
@keyframes page{from{opacity:0}to{opacity:1}}
.bg{position:fixed;inset:0;z-index:-1;background:
 radial-gradient(38% 55% at 0% 28%,rgba(165,178,215,.22),transparent 70%),
 radial-gradient(40% 38% at 100% 0%,rgba(165,178,215,.30),transparent 70%),
 radial-gradient(30% 40% at 0% 0%,rgba(165,178,215,.14),transparent 70%),#000}
header{border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar{max-width:1920px;margin:0 auto;height:116px;padding:0 clamp(24px,9vw,168px);display:flex;align-items:center}
.brand img{display:block;width:58px;height:auto;filter:drop-shadow(0 0 12px rgba(170,185,230,.4))}
.sep{width:2px;height:80px;margin:0 56px 0 30px;background:linear-gradient(transparent,rgba(255,255,255,.85),transparent)}
nav{display:flex;gap:40px}
nav a{color:#e3e5ea;text-decoration:none;font-size:18px;font-weight:400;transition:color .2s}
nav a:hover{color:#fff}
.sp{flex:1}
.ico{display:grid;place-items:center;width:32px;height:32px;margin-right:16px;color:#b9bcc6;transition:color .2s}
.ico:hover{color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font:400 20px Outfit,system-ui,sans-serif;color:#fff;transition:transform .2s,background .2s}
.btn:hover{transform:translateY(-1px)}
.top{height:66px;padding:0 50px;margin-left:34px;border-radius:18px;border:1px solid rgba(200,210,240,.28);border-bottom-color:rgba(200,210,240,.7);background:linear-gradient(180deg,#000 40%,#1a1d28)}
.hero{max-width:1920px;margin:0 auto;padding:0 clamp(24px,9vw,168px);display:grid;grid-template-columns:1.15fr .85fr;gap:20px;align-items:center;min-height:calc(100vh - 117px)}
.copy{padding:60px 0}
h1{margin:0 0 34px;font:300 clamp(40px,4.2vw,72px)/1.45 Outfit,sans-serif;letter-spacing:.005em}
h1 span{display:block;font-weight:400;background:linear-gradient(180deg,#eef1fb 10%,#8f9ab8);-webkit-background-clip:text;background-clip:text;color:transparent}
.copy p{margin:0 0 34px;max-width:690px;font-size:21px;line-height:1.95;color:#f1f2f5}
.cta{display:flex;gap:20px;flex-wrap:wrap}
.cta .btn{height:62px;padding:0 31px;border-radius:14px;font-size:19px}
.solid{background:#fff;color:#000}
.solid:hover{background:#eef0f6}
.ghost{background:#26262b;border:1px solid rgba(255,255,255,.14)}
.ghost:hover{background:#303036}
.art{display:grid;place-items:center}
.art svg{width:min(100%,640px);height:auto;overflow:visible}

@media (max-width:900px){
 .bar{height:84px;padding:0 20px}.sep,nav{display:none}.brand img{width:46px}.top{height:50px;padding:0 24px;font-size:17px;margin-left:10px}
 .hero{grid-template-columns:1fr;text-align:center;padding:30px 20px 60px;min-height:0}
 .copy p{margin-left:auto;margin-right:auto;font-size:18px}.cta{justify-content:center}.art{order:-1}.art svg{width:min(70%,340px)}
 h1{line-height:1.3}
}
</style>
