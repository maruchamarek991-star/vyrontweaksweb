<style>
:root{--bg:#050506;--line:rgba(255,255,255,.1);--text:#f4f5f7;--body:#c5c8d1;--mute:#9a9ea8;--card:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.012))}
[data-theme=light]{--bg:#eef0f4;--line:rgba(0,0,0,.12);--text:#101114;--body:#3a3e48;--mute:#5d616b;--card:rgba(255,255,255,.75)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:400 16px/1.7 Inter,system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(45% 35% at 50% 0%,rgba(170,185,255,.08),transparent 70%)}
.top,.doc,.bot{position:relative;z-index:1;width:min(820px,calc(100% - 36px));margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:26px 0 18px}
.brand{display:flex;align-items:center;gap:10px;color:var(--text);text-decoration:none;font:700 18px Manrope,sans-serif;letter-spacing:-.01em}
.brand img{width:30px;height:auto;display:block}
.topr{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.back{color:var(--mute);text-decoration:none;font:500 14px Inter,sans-serif;padding:8px 14px;border:1px solid var(--line);border-radius:10px;transition:.2s}
.back:hover{color:var(--text)}
.doc{margin-top:8px;margin-bottom:34px;padding:44px;border:1px solid var(--line);border-radius:18px;background:var(--card)}
h1{margin:0 0 10px;font:800 clamp(32px,5vw,46px)/1.1 Manrope,Inter,sans-serif;letter-spacing:-.03em}
.upd{margin:0 0 28px;color:var(--mute);font:500 12px "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase}
.lead{color:var(--body);font-size:17px;margin:0 0 8px}
h2{margin:36px 0 10px;font:700 21px Manrope,Inter,sans-serif;letter-spacing:-.01em}
p,li{color:var(--body)}
p{margin:0 0 12px}
ul{margin:0 0 12px;padding-left:22px}li{margin:5px 0}
a{color:var(--text);text-underline-offset:3px}
b,strong{color:var(--text);font-weight:600}
.bot{padding:0 0 46px;display:flex;flex-wrap:wrap;gap:8px 22px;justify-content:space-between;color:var(--mute);font-size:13px}
.bot nav{display:flex;flex-wrap:wrap;gap:6px 18px}
.bot a{color:var(--mute);text-decoration:none}.bot a:hover{color:var(--text)}
a:focus-visible{outline:2px solid rgba(190,205,255,.6);outline-offset:2px;border-radius:4px}
@media(max-width:620px){.doc{padding:26px 20px}}

</style>

<style>.nf{text-align:center;padding:70px 30px}.nf .code{font:800 clamp(80px,22vw,160px)/1 Manrope,sans-serif;letter-spacing:-.05em;background:linear-gradient(180deg,#fff 15%,#8f96ab);-webkit-background-clip:text;background-clip:text;color:transparent}[data-theme=light] .nf .code{background:linear-gradient(180deg,#101114,#5d616b);-webkit-background-clip:text;background-clip:text}.nf p{max-width:460px;margin:12px auto 26px}.nf .back{display:inline-block;color:var(--text)}[lang=pl] [data-l=en],[lang=en] [data-l=pl]{display:none}</style>
</head>

<main class="doc nf">
