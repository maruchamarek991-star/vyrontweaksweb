<!DOCTYPE html>

<head>

<link rel="icon" href="/favicon.ico?v=20" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=20">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050506;--text:#f4f5f7;--mute:#9a9ea8;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:400 16px/1.6 Inter,system-ui,sans-serif;overflow-x:hidden;animation:page .5s ease both}
@keyframes page{from{opacity:0}to{opacity:1}}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(55% 60% at 8% 22%,rgba(150,165,205,.16),transparent 70%),radial-gradient(45% 50% at 85% 55%,rgba(120,140,190,.10),transparent 70%),var(--bg)}
header{border-bottom:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding-top:env(safe-area-inset-top,0px)}
.bar{max-width:1280px;margin:0 auto;height:76px;padding:0 28px;display:flex;align-items:center;gap:28px}
.brand{display:flex;align-items:center;gap:12px;color:var(--text);text-decoration:none;font:700 20px "Space Grotesk",Inter,sans-serif;letter-spacing:.04em}
.brand img{width:38px;height:auto;filter:drop-shadow(0 0 10px rgba(160,180,255,.35))}
.sep{width:1px;height:46px;background:linear-gradient(transparent,rgba(255,255,255,.35),transparent)}
nav a{color:#d6d8de;text-decoration:none;font-size:15px;padding:6px 4px}
nav a:hover{color:#fff}
.sp{flex:1}
.ico{display:grid;place-items:center;width:40px;height:40px;color:var(--mute);border-radius:10px;transition:color .2s,background .2s}
.ico:hover{color:#fff;background:rgba(255,255,255,.07)}
.btn{display:inline-block;text-decoration:none;font:500 16px Inter,system-ui,sans-serif;padding:15px 30px;border-radius:14px;border:1px solid var(--line);color:var(--text);background:linear-gradient(180deg,#17181c,#0b0b0d);transition:transform .2s,background .2s}
.btn:hover{transform:translateY(-1px)}
.btn.solid{background:#f4f5f7;color:#0a0a0c;border-color:transparent}
.btn.solid:hover{background:#fff}
.btn.ghost{background:rgba(255,255,255,.06)}
.btn.ghost:hover{background:rgba(255,255,255,.1)}
.btn.sm{padding:12px 28px}
.hero{max-width:1280px;margin:0 auto;padding:70px 28px 80px;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;min-height:calc(100vh - 77px)}
h1{margin:0 0 26px;font:600 clamp(40px,6.4vw,78px)/1.2 "Space Grotesk",Inter,sans-serif}
h1 span{display:block;background:linear-gradient(180deg,#fff 10%,#8e9099);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0 0 34px;max-width:520px;color:#c9ccd4;font-size:19px}
.cta{display:flex;gap:16px;flex-wrap:wrap}
.art{display:grid;place-items:center}
.art svg{width:min(100%,520px);height:auto;overflow:visible}
@media (max-width:900px){
 .hero{grid-template-columns:1fr;text-align:center;padding-top:40px;min-height:0}
 .hero p{margin-left:auto;margin-right:auto}.cta{justify-content:center}.art{order:-1}.art svg{width:min(70%,340px)}
 nav,.sep{display:none}.bar{padding:0 18px}
}
</style>
</head>
<body>
<div class="bg"></div>
<header>
<div class="bar">
<a class="brand" href="/"><img src="/logo.png?v=20" alt="" width="38" height="31">Vyron</a>
<div class="sep"></div>
<nav><a href="/">Home</a></nav>
<div class="sp"></div>
<a class="ico" href="https://discord.gg/vyron" target="_blank" rel="noopener" aria-label="Discord"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.2.4a18 18 0 0 1 4.4 2.2 15 15 0 0 0-15.2 0A18 18 0 0 1 8.8 3.4L8.6 3a19.8 19.8 0 0 0-4.9 1.4C.6 9 0 13.5.3 17.9a19.9 19.9 0 0 0 6 3l1.3-2.1c-.7-.3-1.4-.6-2-1l.5-.4a14.2 14.2 0 0 0 12.2 0l.5.4c-.6.4-1.3.7-2 1l1.3 2.1a19.9 19.9 0 0 0 6-3c.4-5.100-.7-9.600-3.800-13.500ZM8.500 15.200c-1.200 0-2.100-1.100-2.100-2.400s.9-2.400 2.100-2.400 2.100 1.100 2.100 2.400-.9 2.400-2.100 2.400Zm7 0c-1.200 0-2.100-1.100-2.100-2.400s.9-2.400 2.100-2.400 2.100 1.100 2.100 2.400-.9 2.400-2.100 2.400Z"/></svg></a>
<a class="btn sm" href="https://discord.gg/vyron" target="_blank" rel="noopener">Get Started</a>
</div>
</header>
<main class="hero">
<div>
<h1>Welcome to <span>Vyron</span></h1>
<p>Something new is on the way. Join our Discord to stay in the loop.</p>
<div class="cta">
<a class="btn solid" href="https://discord.gg/vyron" target="_blank" rel="noopener">Get Started</a>
<a class="btn ghost" href="https://discord.gg/vyron" target="_blank" rel="noopener">Join Discord</a>
</div>
</div>
<div class="art">
<svg viewBox="0 0 400 400" role="img" aria-label="Vyron">
<defs>
<linearGradient id="hx" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#9aa6c4"/><stop offset="1" stop-color="#5b6685"/></linearGradient>
<radialGradient id="gl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#8fa2d8" stop-opacity=".28"/><stop offset="1" stop-color="#8fa2d8" stop-opacity="0"/></radialGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<circle cx="200" cy="200" r="200" fill="url(#gl)"/>
<polygon points="200,18 358,109 358,291 200,382 42,291 42,109" fill="none" stroke="url(#hx)" stroke-width="16" stroke-linejoin="round" opacity=".55" filter="url(#sh)"/>
<polygon points="200,18 358,109 358,291 200,382 42,291 42,109" fill="rgba(255,255,255,.03)" stroke="url(#hx)" stroke-width="12" stroke-linejoin="round"/>
<image href="/logo.png?v=20" x="110" y="123" width="180" height="149" preserveAspectRatio="xMidYMid meet"/>
</svg>
</div>
</main>
</body>
</html>
